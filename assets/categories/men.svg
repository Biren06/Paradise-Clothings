<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 450" fill="none">
  <rect width="400" height="450" rx="8" fill="#F4F8F9" />
  <circle cx="200" cy="180" r="110" fill="#D9EEF2" />
  
  <!-- Coastal Motif -->
  <path d="M120 320 C160 300 240 300 280 320" stroke="#6FA3A9" stroke-width="3" stroke-linecap="round" fill="none" />
  <path d="M140 335 C175 320 225 320 260 335" stroke="#2F4858" stroke-width="2" stroke-linecap="round" fill="none" />

  <!-- Linen Resort Shirt Graphic -->
  <g transform="translate(140, 110)">
    <!-- Collar & Shoulders -->
    <path d="M20 25 L 45 40 L 60 15 L 75 40 L 100 25 L 115 50 L 95 65 L 95 130 L 25 130 L 25 65 L 5 50 Z" fill="#FFFFFF" stroke="#2F4858" stroke-width="3.5" stroke-linejoin="round" />
    <!-- V-Placket -->
    <path d="M50 40 L 60 65 L 70 40" fill="#D9EEF2" stroke="#2F4858" stroke-width="2" />
    <line x1="60" y1="65" x2="60" y2="125" stroke="#2F4858" stroke-width="2" stroke-dasharray="4 6" />
    <!-- Pocket -->
    <rect x="35" y="70" width="18" height="22" rx="2" fill="none" stroke="#6FA3A9" stroke-width="2" />
  </g>

  <!-- Palm Leaf Silhouette -->
  <path d="M290 80 Q 320 120 310 160 Q 300 130 275 110 Z" fill="#6FA3A9" opacity="0.6" />
</svg>
